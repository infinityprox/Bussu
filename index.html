<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#fff8ec" />
<title>Pasi — AI recipe assistant</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#c8372d;--yellow:#f4b41a;--cream:#fff8ec;--brown:#3b2a20}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--brown);font-family:Poppins,'Noto Sans Tamil',sans-serif}
button,input,select{font:inherit}.font-tamil{font-family:'Noto Sans Tamil',Poppins,sans-serif}
.dark body{background:#1e1916;color:#fff4e5}.dark .surface{background:#2c241f!important;color:#fff4e5!important;border-color:#493a31!important}.dark .muted{color:#c8b7a7!important}.dark input,.dark select{background:#211b17!important;color:#fff4e5!important;border-color:#59483d!important}
.surface{background:#fffdf8;border:1px solid #f0e5d6}.muted{color:#806f61}.btn-red{background:var(--red);color:white}.btn-red:hover{background:#a92d25}.chip{border:1px solid #ead9c5;background:#fffaf1}.chip-active{background:#3b2a20;color:white;border-color:#3b2a20}.tag-have{background:#e4f5e8;color:#23743a}.tag-miss{background:#fff0d8;color:#995b08}
.skeleton{background:linear-gradient(90deg,#eee4d8 25%,#f8f2e9 50%,#eee4d8 75%);background-size:200% 100%;animation:shimmer 1.3s infinite}@keyframes shimmer{to{background-position:-200% 0}}
.stepper button{width:34px;height:34px;border-radius:50%;background:#f7ead7;font-weight:700}.dark .stepper button{background:#493a31;color:#fff4e5}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo}=React;
const QUICK=['thakkali','vengayam','muttai','paneer','urulai','arisi'];
const SYSTEM_PROMPT=`You are a friendly Indian home-cooking assistant inside a recipe app called Pasi. The user gives you ingredients they have at home. Suggest exactly 3 recipes that mainly use those ingredients.
Rules:
- Assume basic pantry items: salt, oil, water, turmeric, chilli powder, coriander powder, mustard seeds, cumin. Never list them as missing.
- Respect diet, max time and spice level.
- If the user mentions an allergy, never include that ingredient.
- Prefer South Indian / Tamil home-style dishes when suitable, with some variety.
- Write in the requested language: tamil, english or tanglish.
- 5 to 8 short steps per recipe.
- Quantities are for the requested servings.
- Respond ONLY with valid JSON, no markdown, no backticks.
JSON format:
{"recipes":[{"name":"","description":"","time_minutes":0,"servings":0,"difficulty":"easy|medium|hard","spice_level":"mild|medium|hot","diet":"veg|non-veg","ingredients":[{"item":"","amount":0,"unit":"","have":true}],"missing_ingredients":[""],"steps":[""],"tip":""}]}`;
const translations={
 english:{title:'What can we cook today?',sub:'A little hunger, a lot of possibilities.',ingredients:'What is in your fridge?',placeholder:'Type an ingredient and press Enter…',get:'Get recipes',surprise:'Surprise me',empty:'Fridge la enna irukku? Sollunga, naan pathukkaren.',favorites:'Favorites',recipes:'Recipes',loading:'Pasi aarra varaikum, samaichitu irukken...',allergy:'Allergies (optional)',servings:'Servings',diet:'Diet',time:'Max time',spice:'Spice level',language:'Language',retry:'Retry',tip:'Chef’s tip',steps:'How to make it',have:'You have',missing:'Need to get',copy:'Copy recipe',copied:'Copied!',back:'Back to recipes',noFav:'No favorites yet. Tap the heart on a recipe to save it.'},
 tamil:{title:'இன்று என்ன சமைக்கலாம்?',sub:'பசிக்கு ஏற்ற சுவையான சமையல்.',ingredients:'உங்கள் ஃப்ரிட்ஜில் என்ன இருக்கிறது?',placeholder:'பொருளை எழுதுங்கள்…',get:'சமையல் குறிப்புகள்',surprise:'ஏதாவது ஆச்சரியம்',empty:'Fridge la enna irukku? Sollunga, naan pathukkaren.',favorites:'விருப்பமானவை',recipes:'சமையல் குறிப்புகள்',loading:'Pasi aarra varaikum, samaichitu irukken...',allergy:'ஒவ்வாமை (விருப்பம்)',servings:'பரிமாறல்',diet:'உணவு முறை',time:'அதிகபட்ச நேரம்',spice:'காரம்',language:'மொழி',retry:'மீண்டும் முயற்சி',tip:'சமையல் குறிப்பு',steps:'செய்முறை',have:'உங்களிடம் உள்ளது',missing:'வாங்க வேண்டும்',copy:'நகலெடு',copied:'நகலெடுக்கப்பட்டது!',back:'திரும்பச் செல்ல',noFav:'விருப்பமான சமையல் குறிப்புகள் இன்னும் இல்லை.'},
 tanglish:{title:'Innaiku enna samaikkalam?',sub:'Pasi ku etha maadhiri super-a samaikkalam.',ingredients:'Fridge la enna irukku?',placeholder:'Ingredient type panni Enter press pannunga…',get:'Recipes paarpom',surprise:'Surprise me',empty:'Fridge la enna irukku? Sollunga, naan pathukkaren.',favorites:'Favorites',recipes:'Recipes',loading:'Pasi aarra varaikum, samaichitu irukken...',allergy:'Allergies (optional)',servings:'Servings',diet:'Diet',time:'Max time',spice:'Spice level',language:'Language',retry:'Retry',tip:'Chef tip',steps:'Eppadi seiyanum',have:'Ungakitta irukku',missing:'Vaanga vendiyathu',copy:'Copy recipe',copied:'Copied!',back:'Recipes-ku thirumba',noFav:'Innum favorites save pannala. Heart tap pannunga.'}
};
function App(){
 const [items,setItems]=useState([]),[entry,setEntry]=useState(''),[diet,setDiet]=useState('any'),[time,setTime]=useState('30'),[spice,setSpice]=useState('medium'),[servings,setServings]=useState(2),[allergies,setAllergies]=useState(''),[language,setLanguage]=useState('english'),[recipes,setRecipes]=useState([]),[favorites,setFavorites]=useState([]),[active,setActive]=useState(null),[tab,setTab]=useState('recipes'),[loading,setLoading]=useState(false),[error,setError]=useState(''),[dark,setDark]=useState(false),[copied,setCopied]=useState(false);
 const t=translations[language];
 React.useEffect(()=>{document.documentElement.classList.toggle('dark',dark)},[dark]);
 function addItem(v){const x=v.trim().replace(/,$/,'');if(x&&!items.some(a=>a.toLowerCase()===x.toLowerCase()))setItems([...items,x]);setEntry('')}
 function toggleFav(r){setFavorites(old=>old.some(x=>x.name===r.name)?old.filter(x=>x.name!==r.name):[...old,r])}
 async function getRecipes(){
  if(!items.length){setError('Add at least one ingredient first.');return}
  setLoading(true);setError('');setActive(null);setTab('recipes');
  const userPrompt='Ingredients I have: '+items.join(', ')+'\nDiet: '+diet+'\nMax time: '+time+' minutes\nSpice level: '+spice+'\nServings: '+servings+'\nAllergies: '+(allergies.trim()||'none')+'\nLanguage: '+language;
  try{
   const response=await fetch('/api/recipes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:SYSTEM_PROMPT,prompt:userPrompt})});
   if(!response.ok){const e=await response.json().catch(()=>({}));throw new Error(e.error||'Recipe service is not configured yet. Please try again.')}
   const payload=await response.json();
   let raw=payload.content||payload.text||payload;
   if(Array.isArray(raw))raw=raw.map(x=>x.text||'').join('');
   if(typeof raw!=='string')raw=JSON.stringify(raw);
   raw=raw.trim().replace(/^\s*```(?:json)?\s*/i,'').replace(/\s*```\s*$/,'');
   const parsed=JSON.parse(raw);
   if(!Array.isArray(parsed.recipes)||parsed.recipes.length!==3)throw new Error('The recipe response was incomplete. Please retry.');
   setRecipes(parsed.recipes);setTab('recipes');
  }catch(e){setError(e.message||'Something went wrong. Please try again.')}
  finally{setLoading(false)}
 }
 function surprise(){const shuffled=[...QUICK].sort(()=>Math.random()-.5).slice(0,3);setItems(shuffled);setError('')}
 function scaled(n,r){const base=Number(r.servings)||servings;const amount=Number(n.amount)||0;const value=amount*servings/base;return Number.isInteger(value)?value:Number(value.toFixed(2))}
 async function copyRecipe(r){const text=[r.name,r.description,'', 'Ingredients:',...(r.ingredients||[]).map(i=>'- '+i.item+': '+scaled(i,r)+' '+(i.unit||'')), '', 'Steps:',...(r.steps||[]).map((s,i)=>(i+1)+'. '+s),'','Tip: '+r.tip].join('\n');try{await navigator.clipboard.writeText(text);setCopied(true);setTimeout(()=>setCopied(false),1600)}catch(e){setError('Could not copy. Please allow clipboard access.')}}
 const shown=tab==='favorites'?favorites:recipes;
 return <div className="min-h-screen pb-12">
  <header className="sticky top-0 z-20 border-b border-[#eadfce] bg-[#fff8ec]/95 backdrop-blur dark:bg-[#211b17]/95 dark:border-[#493a31]">
   <div className="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
    <button onClick={()=>{setActive(null);setTab('recipes')}} className="flex items-center gap-2"><span className="grid h-10 w-10 place-items-center rounded-2xl bg-[#c8372d] text-xl text-white">🍲</span><span className="text-2xl font-extrabold tracking-tight">pasi<span className="text-[#c8372d]">.</span></span></button>
    <div className="flex items-center gap-2"><button onClick={()=>setTab('favorites')} className={'rounded-full px-3 py-2 text-sm font-semibold '+(tab==='favorites'?'bg-[#3b2a20] text-white':'surface')}>♡ {t.favorites} ({favorites.length})</button><button onClick={()=>setDark(!dark)} className="surface rounded-full px-3 py-2" aria-label="Toggle dark mode">{dark?'☀️':'🌙'}</button></div>
   </div>
  </header>
  <main className="mx-auto max-w-5xl px-4 pt-8">
   <section className="mb-7 text-center"><div className="mb-3 inline-flex items-center gap-2 rounded-full bg-[#f4b41a]/20 px-4 py-2 text-xs font-bold uppercase tracking-wider text-[#8b5b00]">✦ Your kitchen, your possibilities</div><h1 className="text-3xl font-extrabold leading-tight sm:text-5xl">{t.title}</h1><p className="muted mt-3 text-sm sm:text-base">{t.sub}</p><p className="mt-2 text-sm font-semibold text-[#c8372d]">“Pasi ku onnu, fridge la irukku.”</p></section>
   {!active&&<section className="surface rounded-3xl p-4 shadow-sm sm:p-6">
    <div className="mb-3 flex items-center justify-between gap-2"><h2 className="text-lg font-bold">🥕 {t.ingredients}</h2><span className="muted text-xs">{items.length} added</span></div>
    <div className="flex gap-2"><input value={entry} onChange={e=>setEntry(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();addItem(entry)}}} onBlur={()=>{if(entry.endsWith(','))addItem(entry)}} placeholder={t.placeholder} className="min-w-0 flex-1 rounded-xl border border-[#ead9c5] bg-white px-4 py-3 text-sm outline-none focus:border-[#c8372d]"/><button onClick={()=>addItem(entry)} className="btn-red rounded-xl px-4 font-bold">Add</button></div>
    <div className="mt-3 flex flex-wrap gap-2">{items.map(x=><button key={x} onClick={()=>setItems(items.filter(a=>a!==x))} className="chip rounded-full px-3 py-1.5 text-sm"> {x} <span className="ml-1 text-[#c8372d]">×</span></button>)}</div>
    <div className="mt-4 flex flex-wrap items-center gap-2"><span className="muted mr-1 text-xs font-semibold">QUICK ADD</span>{QUICK.map(x=><button key={x} onClick={()=>addItem(x)} disabled={items.includes(x)} className="rounded-full border border-dashed border-[#d7c3aa] px-3 py-1.5 text-xs font-medium disabled:opacity-40">+ {x}</button>)}</div>
    <div className="my-5 border-t border-[#efe4d6]"></div>
    <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
     <label className="text-sm font-semibold">{t.diet}<select value={diet} onChange={e=>setDiet(e.target.value)} className="mt-2 w-full rounded-xl border border-[#ead9c5] bg-white px-3 py-3 text-sm"><option value="any">Any</option><option value="veg">Veg</option><option value="non-veg">Non-veg</option></select></label>
     <label className="text-sm font-semibold">{t.time}<select value={time} onChange={e=>setTime(e.target.value)} className="mt-2 w-full rounded-xl border border-[#ead9c5] bg-white px-3 py-3 text-sm">{['15','30','45','60'].map(x=><option key={x} value={x}>{x} minutes</option>)}</select></label>
     <label className="text-sm font-semibold">{t.spice}<select value={spice} onChange={e=>setSpice(e.target.value)} className="mt-2 w-full rounded-xl border border-[#ead9c5] bg-white px-3 py-3 text-sm"><option value="mild">Mild</option><option value="medium">Medium</option><option value="hot">Hot</option></select></label>
     <div className="text-sm font-semibold">{t.servings}<div className="stepper mt-2 flex items-center gap-3"><button onClick={()=>setServings(Math.max(1,servings-1))}>−</button><span className="w-5 text-center text-base">{servings}</span><button onClick={()=>setServings(Math.min(8,servings+1))}>+</button><span className="muted text-xs">people</span></div></div>
     <label className="text-sm font-semibold">{t.allergy}<input value={allergies} onChange={e=>setAllergies(e.target.value)} placeholder="e.g. peanuts, milk" className="mt-2 w-full rounded-xl border border-[#ead9c5] bg-white px-3 py-3 text-sm font-normal"/></label>
     <label className="text-sm font-semibold">{t.language}<select value={language} onChange={e=>setLanguage(e.target.value)} className="mt-2 w-full rounded-xl border border-[#ead9c5] bg-white px-3 py-3 text-sm"><option value="tamil">தமிழ்</option><option value="english">English</option><option value="tanglish">Tanglish</option></select></label>
    </div>
    <div className="mt-6 flex flex-col gap-3 sm:flex-row"><button onClick={getRecipes} disabled={loading} className="btn-red flex-1 rounded-2xl px-5 py-4 font-bold shadow-md disabled:opacity-60">{loading?'Cooking…':'✦ '+t.get}</button><button onClick={surprise} className="rounded-2xl border border-[#e5d4bd] px-5 py-4 font-bold">🎲 {t.surprise}</button></div>
   </section>}
   {error&&<div className="mt-5 flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-[#efc6b8] bg-[#fff0eb] p-4 text-sm text-[#9e3328]"><span>{error}</span><button onClick={getRecipes} className="rounded-xl bg-[#c8372d] px-4 py-2 font-bold text-white">{t.retry}</button></div>}
   {loading&&<section className="mt-8"><p className="mb-4 text-center font-semibold">{t.loading}</p><div className="grid gap-4 md:grid-cols-3">{[1,2,3].map(x=><div key={x} className="surface rounded-3xl p-5"><div className="skeleton h-36 rounded-2xl"></div><div className="skeleton mt-4 h-5 w-3/4 rounded"></div><div className="skeleton mt-3 h-3 rounded"></div><div className="skeleton mt-2 h-3 w-1/2 rounded"></div></div>)}</div></section>}
   {!loading&&!active&&<section className="mt-8">
    <div className="mb-4 flex items-center justify-between"><h2 className="text-xl font-extrabold">{tab==='favorites'?'♡ '+t.favorites:'🍛 '+t.recipes}</h2>{recipes.length>0&&tab==='recipes'&&<span className="muted text-xs">3 ideas for your kitchen</span>}</div>
    {shown.length===0?<div className="surface rounded-3xl px-6 py-12 text-center"><div className="text-5xl">🧺</div><p className="mt-4 font-semibold">{tab==='favorites'?t.noFav:t.empty}</p></div>:<div className="grid gap-4 md:grid-cols-3">{shown.map((r,i)=><article key={r.name+i} onClick={()=>setActive(r)} className="surface cursor-pointer rounded-3xl p-5 shadow-sm transition hover:-translate-y-1 hover:shadow-md"><div className="mb-4 flex items-start justify-between"><span className="grid h-12 w-12 place-items-center rounded-2xl bg-[#f4b41a]/20 text-2xl">{['🍚','🥘','🍲'][i%3]}</span><button onClick={e=>{e.stopPropagation();toggleFav(r)}} className="rounded-full p-2 text-2xl text-[#c8372d]" aria-label="Save favorite">{favorites.some(x=>x.name===r.name)?'♥':'♡'}</button></div><div className="mb-2 flex flex-wrap gap-2"><span className="rounded-full bg-[#e4f5e8] px-2.5 py-1 text-xs font-bold text-[#23743a]">{r.diet==='veg'?'VEG':'NON-VEG'}</span><span className="rounded-full bg-[#fff0d8] px-2.5 py-1 text-xs font-bold text-[#995b08]">{r.spice_level}</span></div><h3 className="text-lg font-extrabold">{r.name}</h3><p className="muted mt-1 min-h-10 text-sm">{r.description}</p><div className="mt-4 flex flex-wrap gap-3 border-t border-[#efe4d6] pt-3 text-xs font-semibold"><span>◷ {r.time_minutes} min</span><span>• {r.difficulty}</span></div><p className="mt-4 text-xs font-bold text-[#c8372d]">View recipe →</p></article>)}</div>}
   </section>}
   {active&&<section className="surface mt-3 rounded-3xl p-5 shadow-sm sm:p-7">
    <button onClick={()=>setActive(null)} className="mb-5 text-sm font-bold text-[#c8372d]">← {t.back}</button>
    <div className="flex flex-wrap items-start justify-between gap-3"><div><div className="mb-2 flex gap-2"><span className="rounded-full bg-[#e4f5e8] px-3 py-1 text-xs font-bold text-[#23743a]">{active.diet==='veg'?'VEG':'NON-VEG'}</span><span className="rounded-full bg-[#fff0d8] px-3 py-1 text-xs font-bold text-[#995b08]">{active.spice_level}</span></div><h2 className="text-2xl font-extrabold sm:text-3xl">{active.name}</h2><p className="muted mt-2 text-sm">{active.description}</p></div><button onClick={()=>toggleFav(active)} className="rounded-full border border-[#ead9c5] px-4 py-2 text-2xl text-[#c8372d]">{favorites.some(x=>x.name===active.name)?'♥':'♡'}</button></div>
    <div className="mt-5 flex flex-wrap gap-4 text-sm font-semibold"><span>◷ {active.time_minutes} min</span><span>• {active.difficulty}</span></div>
    <div className="my-6 flex flex-wrap items-center justify-between gap-3 border-y border-[#efe4d6] py-4"><h3 className="font-extrabold">🥕 Ingredients</h3><div className="stepper flex items-center gap-3"><button onClick={()=>setServings(Math.max(1,servings-1))}>−</button><span className="text-sm font-bold">{servings} servings</span><button onClick={()=>setServings(Math.min(8,servings+1))}>+</button></div></div>
    <div className="grid gap-2 sm:grid-cols-2">{(active.ingredients||[]).map((ing,i)=><div key={i} className="flex items-center justify-between gap-2 rounded-xl bg-[#fff8ec] p-3 text-sm dark:bg-[#211b17]"><span>{ing.have?'🟢':'🟠'} {ing.item}</span><span className="muted whitespace-nowrap">{scaled(ing,active)} {ing.unit}</span></div>)}</div>
    {(active.missing_ingredients||[]).filter(Boolean).length>0&&<p className="mt-3 text-xs text-[#995b08]">Need to get: {active.missing_ingredients.join(', ')}</p>}
    <h3 className="mt-7 text-lg font-extrabold">👩‍🍳 {t.steps}</h3><ol className="mt-3 space-y-3">{(active.steps||[]).map((s,i)=><li key={i} className="flex gap-3 text-sm leading-6"><span className="grid h-7 w-7 shrink-0 place-items-center rounded-full bg-[#c8372d] text-xs font-bold text-white">{i+1}</span><span>{s}</span></li>)}</ol>
    <div className="mt-6 rounded-2xl bg-[#f4b41a]/15 p-4"><p className="font-bold">💡 {t.tip}</p><p className="mt-1 text-sm">{active.tip}</p></div>
    <button onClick={()=>copyRecipe(active)} className="mt-5 w-full rounded-2xl border border-[#d9c7b1] px-4 py-3 font-bold">▢ {copied?t.copied:t.copy}</button>
   </section>}
  </main>
  <footer className="muted mx-auto mt-12 max-w-5xl px-4 text-center text-xs">AI-generated recipes. Check ingredients for allergies before cooking.</footer>
 </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
