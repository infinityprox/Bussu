<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101a27"><title>CityLife3D — Free 3D City</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a27;color:#fff;font-family:system-ui,sans-serif;touch-action:none}#world{position:absolute;inset:0}.glass{background:linear-gradient(145deg,#101a27e8,#172b3be0);border:1px solid #ffffff35;border-radius:14px;box-shadow:0 8px 24px #0006;backdrop-filter:blur(12px)}#brand{position:absolute;top:13px;left:13px;padding:9px 13px;font-weight:900;letter-spacing:.12em;font-size:13px;pointer-events:none}#brand span{color:#75dcff}#mission{position:absolute;top:13px;left:50%;transform:translateX(-50%);padding:9px 12px;max-width:52%;text-align:center;font-size:10px;pointer-events:none}#status{position:absolute;left:13px;top:58px;padding:7px 10px;font-size:10px;letter-spacing:.1em;pointer-events:none}#hint{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:9px 12px;font-size:10px;white-space:nowrap;pointer-events:none}#joystick{position:absolute;left:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:104px;height:104px;border-radius:50%;background:radial-gradient(circle,#ffffff18,#09131e99);border:1px solid #ffffff66;box-shadow:inset 0 0 25px #0007;pointer-events:auto}#stick{position:absolute;left:30px;top:30px;width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#f5fbff,#8eafc2);box-shadow:0 4px 15px #0009;border:1px solid #fff}#actions{position:absolute;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;pointer-events:auto}button{touch-action:manipulation;pointer-events:auto;border:1px solid #ffffff55;border-radius:12px;background:linear-gradient(145deg,#24658a,#12334e);color:white;padding:10px 11px;font-weight:800;min-width:102px;box-shadow:0 6px 18px #0007;font-size:10px}button:active{filter:brightness(1.3);transform:scale(.97)}#start{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(120deg,#0b1724dc,#0b1724a6);backdrop-filter:blur(5px);z-index:5}#start .card{max-width:350px;margin:20px;padding:27px;border-radius:22px;background:linear-gradient(145deg,#1d3447,#111f2d);border:1px solid #ffffff35;text-align:center;box-shadow:0 25px 80px #0009}#start h1{font-size:31px;margin:0 0 8px}#start h1 span{color:#76ddff}#start p{color:#c4d5e1;font-size:13px;line-height:1.6}#start button{background:linear-gradient(145deg,#2699c8,#17618b);width:100%;margin-top:12px;padding:15px}#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:12px 18px;font-size:12px;z-index:3}#credit{position:absolute;bottom:4px;right:8px;font-size:9px;color:#fff;text-shadow:0 1px 4px #000;pointer-events:auto}@media(min-width:700px){#joystick{left:32px;bottom:28px;width:116px;height:116px}#stick{left:35px;top:35px}#actions{right:30px;bottom:28px;gap:8px}#actions button{padding:12px 13px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}
</script>
</head><body>
<div id="world"></div><div id="brand" class="glass">CITYLIFE <span>3D</span></div><div id="mission" class="glass">CITY + BEACH + NPCs</div><div id="status" class="glass">EMPTY WORLD</div><div id="hint" class="glass">Joystick: walk · Drag: rotate camera</div><div id="joystick"><div id="stick"></div></div><div id="actions"><button id="interact">ENTER BUILDING</button><button id="resetView">CINEMATIC VIEW</button><button id="nextTask">NEW TASK</button></div><div id="credit">No map assets loaded</div><div id="loading" class="glass">Loading city and beach districts…</div>
<div id="start"><div class="card"><h1>CityLife<span>3D</span></h1><p>Explore the city, coastal beach and meet local NPCs.</p><button id="play" onclick="document.getElementById('start').remove()">ENTER THE CITY</button></div></div>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bbdce);scene.fog=new THREE.Fog(0x9bbdce,75,190);
const camera=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,.1,320);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.querySelector('#world').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd8efff,0x55634d,2.0));const sun=new THREE.DirectionalLight(0xffe2bd,3.2);sun.position.set(-22,35,16);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);

// Large urban terrain and a connected asphalt street grid
const ground=new THREE.Mesh(new THREE.PlaneGeometry(210,210),new THREE.MeshStandardMaterial({color:0x68735f,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.12;ground.receiveShadow=true;scene.add(ground);
const roadMat=new THREE.MeshStandardMaterial({color:0x30363b,roughness:.94}),sidewalkMat=new THREE.MeshStandardMaterial({color:0x969a98,roughness:1}),lineMat=new THREE.MeshStandardMaterial({color:0xd9d3b7,roughness:.9}),curbMat=new THREE.MeshStandardMaterial({color:0xb7b8b1,roughness:1});
function slab(w,h,d,mat,x,y,z,parent=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.receiveShadow=true;parent.add(m);return m}
for(let k=-2;k<=2;k++){const p=k*40;slab(13,.12,210,roadMat,p,.015,0);slab(210,.12,13,roadMat,0,.016,p);slab(2.3,.18,210,sidewalkMat,p-7.7,.07,0);slab(2.3,.18,210,sidewalkMat,p+7.7,.07,0);slab(210,.18,2.3,sidewalkMat,0,.07,p-7.7);slab(210,.18,2.3,sidewalkMat,0,.07,p+7.7);for(let n=-9;n<=9;n++){const q=n*10;slab(.16,.025,3.4,lineMat,p,.09,q);slab(3.4,.025,.16,lineMat,q,.09,p)}}
for(let k=-2;k<=2;k++){const p=k*40;for(let n=-9;n<=9;n++){const q=n*10;if(n%2===0){slab(.16,.025,3.4,lineMat,p,.09,q);slab(3.4,.025,.16,lineMat,q,.09,p)}}}

const player=new THREE.Group();player.scale.setScalar(2.2);scene.add(player);player.position.set(0,0,0);
function part(parent,geometry,material,x,y,z){const m=new THREE.Mesh(geometry,material);m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m}
const skin=new THREE.MeshStandardMaterial({color:0xc98e68}),shirt=new THREE.MeshStandardMaterial({color:0x176b91}),pants=new THREE.MeshStandardMaterial({color:0x26384c}),shoe=new THREE.MeshStandardMaterial({color:0x17202b});
part(player,new THREE.CylinderGeometry(.25,.3,.72,10),shirt,0,1.05,0);part(player,new THREE.SphereGeometry(.22,12,10),skin,0,1.62,0);
const armL=new THREE.Group(),armR=new THREE.Group(),legL=new THREE.Group(),legR=new THREE.Group();
[[armL,-.31,1.32],[armR,.31,1.32],[legL,-.13,.72],[legR,.13,.72]].forEach(v=>{v[0].position.set(v[1],v[2],0);player.add(v[0])});
part(armL,new THREE.CapsuleGeometry(.085,.42,4,8),shirt,0,-.25,0);part(armR,new THREE.CapsuleGeometry(.085,.42,4,8),shirt,0,-.25,0);
part(legL,new THREE.CapsuleGeometry(.105,.43,4,8),pants,0,-.26,0);part(legR,new THREE.CapsuleGeometry(.105,.43,4,8),pants,0,-.26,0);
part(legL,new THREE.BoxGeometry(.19,.1,.3),shoe,0,-.53,.07);part(legR,new THREE.BoxGeometry(.19,.1,.3),shoe,0,-.53,.07);
let inside=false,returnPosition=new THREE.Vector3(),walkPhase=0;
function buildInterior(){const room=new THREE.Group();room.position.set(300,0,0);scene.add(room);const mat=new THREE.MeshStandardMaterial({color:0x9a8064});const floor=new THREE.Mesh(new THREE.BoxGeometry(10,.25,10),mat);floor.position.y=-.12;room.add(floor);const wallMat=new THREE.MeshStandardMaterial({color:0xe0d4bd});[[-5,0,.25,10],[5,0,.25,10],[0,-5,10,.25],[0,5,10,.25]].forEach(v=>{const w=new THREE.Mesh(new THREE.BoxGeometry(v[2],3,v[3]),wallMat);w.position.set(v[0],1.5,v[1]);room.add(w)});const table=new THREE.Mesh(new THREE.BoxGeometry(2,.18,1.2),new THREE.MeshStandardMaterial({color:0x68442b}));table.position.set(0,.9,-1);room.add(table);return room}
buildInterior();
// Voxel City Districts — CC0 starter scene with 171 GLB models
const buildingSpots=[];
const cityRoot=new THREE.Group();scene.add(cityRoot);
const cityLoader=new (await import('three/addons/loaders/GLTFLoader.js')).GLTFLoader();
cityLoader.load('https://cdn.3dassets.dev/assets/24928/v1/model.glb',gltf=>{
 const pack=gltf.scene;
 pack.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material.side=THREE.FrontSide}}});
 const bounds=new THREE.Box3().setFromObject(pack),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());
 pack.position.x-=center.x;pack.position.z-=center.z;pack.position.y-=bounds.min.y;
 cityRoot.add(pack);
 // Entry interaction points are distributed around the assembled city blocks.
 // Build entry points from the largest assembled district/building groups.
 pack.updateMatrixWorld(true);
 for(const node of pack.children){
  const box=new THREE.Box3().setFromObject(node),dims=box.getSize(new THREE.Vector3());
  if(dims.y>2.2 && dims.x>2.5 && dims.z>2.5 && dims.x<55 && dims.z<55){
   const c=box.getCenter(new THREE.Vector3());
   buildingSpots.push({x:c.x,z:box.max.z+2.2,r:3.8,name:'CITY BUILDING'});
  }
 }
 if(!buildingSpots.length){
  const spanX=Math.max(12,size.x),spanZ=Math.max(12,size.z);
  buildingSpots.push({x:0,z:spanZ*.25,r:4,name:'CITY DISTRICT'});
 }
 scene.fog=new THREE.Fog(0x9bbdce,Math.max(90,Math.max(size.x,size.z)*.65),Math.max(220,Math.max(size.x,size.z)*2.2));
 document.querySelector('#loading').style.display='none';
 document.querySelector('#status').textContent='VOXEL CITY · READY';
 document.querySelector('#mission').textContent='VOXEL CITY DISTRICTS · FREE ROAM';
 document.querySelector('#credit').textContent='Voxel City Districts · CC0 1.0 · 171 GLB models';
 document.querySelector('#hint').textContent='Joystick: walk · Drag: rotate camera · Explore the city';
},undefined,error=>{
 console.error('City pack failed to load:',error);
 document.querySelector('#loading').textContent='Voxel City Districts failed to load. Check your connection and reload.';
 document.querySelector('#status').textContent='MAP LOAD ERROR';
});

// Beach Surf and Paddle Kit — CC0 starter scene (52 GLB models).
// Attached beside the voxel city as a dedicated coastal district.
const beachRoot=new THREE.Group();scene.add(beachRoot);
cityLoader.load('https://cdn.3dassets.dev/assets/39465/v1/model.glb',gltf=>{
 const coast=gltf.scene;
 coast.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
 const b=new THREE.Box3().setFromObject(coast),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());
 coast.position.x-=c.x;coast.position.z-=c.z;coast.position.y-=b.min.y;
 // Place the shoreline just beyond the east edge of the voxel city.
 coast.position.x+=(cityRoot.children.length?new THREE.Box3().setFromObject(cityRoot).max.x:75)+s.x*.5+12;
 beachRoot.add(coast);
 document.querySelector('#mission').textContent='VOXEL CITY + BEACH DISTRICT · FREE ROAM';
 document.querySelector('#credit').textContent='Voxel City Districts + Beach Surf and Paddle Kit · CC0 1.0';
 document.querySelector('#hint').textContent='Explore downtown, then head east to the beach';
},undefined,error=>{console.error('Beach kit failed to load:',error)});


// Low Poly Character Figures — civilian NPC crowd (static baked poses, CC0 1.0).
// This model is intentionally static: the source pack has no rig or skinning.
const npcRoot=new THREE.Group();scene.add(npcRoot);
const npcPlacements=[
 // Downtown sidewalks and shop fronts
 [-9,0,-10],[-4,0,-12],[4,0,-12],[9,0,-9],
 [-11,0,2],[11,0,3],[-8,0,12],[8,0,12],
 [-15,0,20],[15,0,20],[-19,0,-18],[19,0,-18],
 // Extra pedestrians along the main streets and intersections
 [-18,0,-6],[-14,0,-8],[-6,0,-18],[2,0,-19],[12,0,-15],[18,0,-10],
 [-18,0,8],[-13,0,15],[-3,0,18],[5,0,19],[14,0,14],[19,0,7],
 // Beach promenade and coastal area
 [30,0,-12],[34,0,-6],[38,0,2],[42,0,8],[34,0,15],[46,0,-4],
 // Plaza and civic district
 [-27,0,-24],[-22,0,-27],[-16,0,-25],[22,0,-24],[27,0,-19],[25,0,24]
];
cityLoader.load('https://cdn.3dassets.dev/assets/36337/v1/model.glb',gltf=>{
 const base=gltf.scene;
 base.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
 npcPlacements.forEach((p,i)=>{
  const npc=base.clone(true);
  npc.position.set(p[0],p[1],p[2]);
  npc.rotation.y=[0,Math.PI/2,Math.PI,-Math.PI/2][i%4];
  npc.scale.setScalar(2.05);
  npc.traverse(o=>{
   if(o.isMesh){
    o.castShadow=true;o.receiveShadow=true;
    if(Array.isArray(o.material))o.material=o.material.map(m=>m.clone());
    else if(o.material)o.material=o.material.clone();
   }
  });
  npcRoot.add(npc);
 });
 document.querySelector('#status').textContent='CITY + BEACH · 36 NPCs';
 document.querySelector('#hint').textContent='Explore the city and meet the local people';
 document.querySelector('#credit').textContent='Low Poly Character Figures · CC0 1.0 · 36 static civilian NPCs';
},undefined,error=>{console.error('NPC model failed to load:',error)});

let joy={x:0,y:0},heading=0,drag=null,camDist=8.2,mission=0;const tasks=['Explore the downtown blocks','Cruise past the apartments','Visit the shopping street','Explore the city park'];
const j=document.querySelector('#joystick'),stick=document.querySelector('#stick');
function moveJoy(e){const r=j.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy),m=35;if(l>m){dx=dx/l*m;dy=dy/l*m}joy.x=dx/m;joy.y=dy/m;stick.style.transform='translate('+dx+'px,'+dy+'px)'}
j.addEventListener('pointerdown',e=>{j.setPointerCapture(e.pointerId);moveJoy(e)});j.addEventListener('pointermove',e=>{if(e.buttons)moveJoy(e)});function resetJoy(){joy={x:0,y:0};stick.style.transform='translate(0,0)'}j.addEventListener('pointerup',resetJoy);j.addEventListener('pointercancel',resetJoy);
renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY}});addEventListener('pointerup',()=>drag=null);addEventListener('pointermove',e=>{if(drag){heading-=(e.clientX-drag.x)*.006;drag={x:e.clientX,y:e.clientY}}});
function nearestBuildingDistance(){let best=Infinity;for(const b of buildingSpots){const d=Math.hypot(player.position.x-b.x,player.position.z-b.z)-b.r;best=Math.min(best,d)}return best}
const interactButton=document.querySelector('#interact');
interactButton.addEventListener('click',()=>{if(inside){inside=false;player.position.copy(returnPosition);interactButton.textContent='ENTER BUILDING';document.querySelector('#hint').textContent='Walk near a building entrance, then tap ENTER BUILDING';return}const distance=nearestBuildingDistance();if(distance<8){returnPosition.copy(player.position);inside=true;player.position.set(300,0,2);interactButton.textContent='EXIT BUILDING';document.querySelector('#hint').textContent='Inside building · tap EXIT BUILDING to leave'}else{document.querySelector('#hint').textContent='Get closer to a building — walk towards the nearby houses or shops'}});
document.querySelector('#resetView').onclick=()=>{heading=0;camDist=7.2};document.querySelector('#nextTask').onclick=()=>{mission=(mission+1)%tasks.length;document.querySelector('#mission').textContent='TASK 0'+(mission+1)+' · '+tasks[mission]};
document.querySelector('#play').onclick=()=>{document.querySelector('#start').remove()};
let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;const moving=Math.abs(joy.x)+Math.abs(joy.y)>.05;if(moving){heading-=joy.x*1.8*dt;const speed=-joy.y*(inside?3.2:4.4)*dt;player.position.x+=Math.sin(heading)*speed;player.position.z+=Math.cos(heading)*speed;player.rotation.y=heading;walkPhase+=dt*10;armL.rotation.x=Math.sin(walkPhase)*.65;armR.rotation.x=-Math.sin(walkPhase)*.65;legL.rotation.x=-Math.sin(walkPhase)*.7;legR.rotation.x=Math.sin(walkPhase)*.7}else{armL.rotation.x*=.82;armR.rotation.x*=.82;legL.rotation.x*=.82;legR.rotation.x*=.82}const target=new THREE.Vector3(player.position.x-Math.sin(heading)*camDist,inside?3.5:3.9,player.position.z-Math.cos(heading)*camDist);camera.position.lerp(target,.09);camera.lookAt(player.position.x,inside?1.2:1.1,player.position.z);if(!inside){const near=nearestBuildingDistance()<8;interactButton.textContent=near?'ENTER BUILDING':'BUILDING: WALK CLOSER';interactButton.style.opacity=near?'1':'.72'}document.querySelector('#status').textContent=inside?'INSIDE BUILDING':(moving?'ON FOOT · WALKING':'ON FOOT · CITY EXPLORER');renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6))});
</script></body></html>
