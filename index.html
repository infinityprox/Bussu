<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101923">
<title>CityLife3D — Mobile City Sandbox</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101923;color:#fff;font-family:system-ui, sans-serif;touch-action:none}#game{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none}.panel{background:#101923cc;border:1px solid #ffffff2b;border-radius:14px;padding:10px 13px;backdrop-filter:blur(8px)}#brand{position:absolute;top:14px;left:14px;font-weight:800;letter-spacing:.08em}#mission{position:absolute;top:14px;left:50%;transform:translateX(-50%);max-width:48%;text-align:center;font-size:12px}#map{position:absolute;right:14px;top:14px;width:112px;height:112px;border-radius:12px;background:#17222c;border:1px solid #ffffff55}#hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap}#joystick{position:absolute;left:22px;bottom:26px;width:116px;height:116px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff55;pointer-events:auto}#stick{position:absolute;left:34px;top:34px;width:44px;height:44px;border-radius:50%;background:#ffffffbb;box-shadow:0 3px 12px #0008}#actions{position:absolute;right:18px;bottom:25px;display:flex;flex-direction:column;gap:10px;pointer-events:auto}button{border:1px solid #ffffff66;border-radius:13px;background:#152b3ddd;color:white;padding:13px 16px;font-weight:700;min-width:100px}button:active{background:#2c5877}#status{position:absolute;left:14px;top:62px;font-size:11px;color:#d5e6f2}#start{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#101923bb,#101923ee);pointer-events:auto}#start .card{max-width:340px;margin:20px;padding:26px;border-radius:20px;background:#1c2b38;border:1px solid #ffffff30;text-align:center}#start h1{font-size:30px;margin:0 0 8px}#start p{color:#c3d0da;font-size:14px;line-height:1.5}#start button{background:#2b83ad;width:100%;margin-top:12px}
@media(min-width:700px){#joystick{left:40px;bottom:35px}#actions{right:35px;bottom:35px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div id="brand" class="panel">CITYLIFE <span style="color:#70d6ff">3D</span></div>
 <div id="mission" class="panel">MISSION 01 · Explore the city and find the blue marker</div>
 <canvas id="map" width="112" height="112"></canvas>
 <div id="status">ON FOOT · FREE ROAM</div>
 <div id="hint" class="panel">Drag to look · Joystick to move</div>
 <div id="joystick"><div id="stick"></div></div>
 <div id="actions"><button id="enter">ENTER CAR</button><button id="missionBtn">NEW TASK</button></div>
</div>
<div id="start"><div class="card"><h1>CityLife<span style="color:#70d6ff">3D</span></h1><p>A small mobile 3D city sandbox. Explore on foot, hop into a car and discover the city. Best experienced in landscape mode.</p><button id="play">START EXPLORING</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.querySelector('#game'), renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc6df);scene.fog=new THREE.Fog(0x9bc6df,65,190);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
scene.add(new THREE.HemisphereLight(0xd8edff,0x59604c,2));
const sun=new THREE.DirectionalLight(0xfff0d6,2.2);sun.position.set(-35,60,25);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(color,roughness=.9)=>new THREE.MeshStandardMaterial({color,roughness});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),mat(0x63865f));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const roadMat=mat(0x303942), lineMat=mat(0xe6dca9), sidewalk=mat(0x9b9e99);
for(let i=-4;i<=4;i++){let z=i*22;let road=new THREE.Mesh(new THREE.PlaneGeometry(220,9),roadMat);road.rotation.x=-Math.PI/2;road.position.set(0,.025,z);scene.add(road);let r2=new THREE.Mesh(new THREE.PlaneGeometry(9,220),roadMat);r2.rotation.x=-Math.PI/2;r2.position.set(z,.026,0);scene.add(r2);for(let k=-9;k<=9;k++){let dash=new THREE.Mesh(new THREE.PlaneGeometry(3,.13),lineMat);dash.rotation.x=-Math.PI/2;dash.position.set(k*11,.04,z);scene.add(dash);let d2=new THREE.Mesh(new THREE.PlaneGeometry(.13,3),lineMat);d2.rotation.x=-Math.PI/2;d2.position.set(z,.04,k*11);scene.add(d2)}}
for(let i=-4;i<=4;i++)for(let j=-4;j<=4;j++){if(Math.abs(i)%2===0&&Math.abs(j)%2===0)continue;const x=i*22,z=j*22;if(Math.abs(x)<10&&Math.abs(z)<10)continue;const w=7+Math.random()*5,d=7+Math.random()*5,h=7+Math.random()*23;const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat([0xb9b4a8,0xc8b8a0,0x8299a5,0xd0c9b9,0x9bada8][Math.floor(Math.random()*5)]));b.position.set(x,h/2,z);b.castShadow=true;b.receiveShadow=true;scene.add(b);const roof=new THREE.Mesh(new THREE.BoxGeometry(w+.15,.35,d+.15),mat(0x555d62));roof.position.set(x,h+.16,z);scene.add(roof);for(let yy=2;yy<h-1;yy+=3)for(let xx=-w/2+1;xx<w/2-1;xx+=2.3){let win=new THREE.Mesh(new THREE.BoxGeometry(.9,1.15,.08),mat(0x9ed6e6));win.position.set(x+xx,yy,z+d/2+.045);scene.add(win)}}
function makeCar(color=0x2e9ecb){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(2.2,.8,4),mat(color,.45));body.position.y=.8;body.castShadow=true;g.add(body);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.65,.8,2),mat(0x263e50,.35));cabin.position.set(0,1.55,-.25);g.add(cabin);for(const x of [-1.12,1.12])for(const z of [-1.3,1.3]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.22,16),mat(0x15191d));w.rotation.z=Math.PI/2;w.position.set(x,.43,z);g.add(w)}return g}
const car=makeCar();car.position.set(5,0,4);scene.add(car);
const player=new THREE.Group();const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.85,4,8),mat(0xf2a65a));torso.position.y=1.05;torso.castShadow=true;player.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.28,16,12),mat(0xe6b58e));head.position.y=1.85;player.add(head);player.position.set(0,0,0);scene.add(player);
const marker=new THREE.Mesh(new THREE.TorusGeometry(1.5,.18,8,28),new THREE.MeshBasicMaterial({color:0x42d9ff}));marker.rotation.x=Math.PI/2;marker.position.set(35,.25,-35);scene.add(marker);
let driving=false,yaw=0,pitch=.22,speed=0,joy={x:0,y:0},drag=null,task=0;const tasks=[[35,-35,'Reach the blue marker'],[-38,30,'Explore the west district'],[0,-75,'Visit the northern avenue'],[70,0,'Discover the east side']];
function setTask(){task=(task+1)%tasks.length;marker.position.set(tasks[task][0],.25,tasks[task][1]);document.querySelector('#mission').textContent='MISSION 0'+(task+1)+' · '+tasks[task][2]}
document.querySelector('#missionBtn').onclick=setTask;
document.querySelector('#enter').onclick=()=>{driving=!driving;document.querySelector('#enter').textContent=driving?'EXIT CAR':'ENTER CAR';document.querySelector('#status').textContent=driving?'DRIVING · CITY CRUISE':'ON FOOT · FREE ROAM';if(driving){car.position.copy(player.position);car.rotation.y=yaw;player.visible=false}else{player.position.copy(car.position);player.visible=true}};
const joyEl=document.querySelector('#joystick'),stick=document.querySelector('#stick');
function joyMove(e){const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy),m=35;if(l>m){dx=dx/l*m;dy=dy/l*m}joy.x=dx/m;joy.y=dy/m;stick.style.transform=`translate(${dx}px,${dy}px)`}
joyEl.addEventListener('pointerdown',e=>{joyEl.setPointerCapture(e.pointerId);joyMove(e)});joyEl.addEventListener('pointermove',e=>{if(e.buttons)joyMove(e)});function resetJoy(){joy={x:0,y:0};stick.style.transform='translate(0,0)'}joyEl.addEventListener('pointerup',resetJoy);joyEl.addEventListener('pointercancel',resetJoy);
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY}});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-drag.x)*.006;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-drag.y)*.003,-.05,.75);drag={x:e.clientX,y:e.clientY}});window.addEventListener('pointerup',()=>drag=null);
const map=document.querySelector('#map'),ctx=map.getContext('2d');
function drawMap(){ctx.clearRect(0,0,112,112);ctx.fillStyle='#263943';ctx.fillRect(0,0,112,112);ctx.strokeStyle='#89959a';ctx.lineWidth=4;for(let i=0;i<5;i++){let p=12+i*22;ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,112);ctx.moveTo(0,p);ctx.lineTo(112,p);ctx.stroke()}const p=driving?car.position:player.position;ctx.fillStyle='#48d9ff';ctx.beginPath();ctx.arc(56+p.x/220*112,56+p.z/220*112,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(56+marker.position.x/220*112,56+marker.position.z/220*112,3,0,Math.PI*2);ctx.fill()}
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);const target=driving?car:player;const forward=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));const right=new THREE.Vector3(forward.z,0,-forward.x);const input=forward.clone().multiplyScalar(-joy.y).add(right.multiplyScalar(joy.x));if(input.lengthSq()>0){input.normalize();if(driving){speed=THREE.MathUtils.damp(speed, -joy.y*14,3,dt);car.rotation.y=yaw;car.position.addScaledVector(input,dt*9)}else{player.position.addScaledVector(input,dt*5);player.rotation.y=Math.atan2(input.x,input.z)}}else if(driving)speed=THREE.MathUtils.damp(speed,0,2,dt);if(driving&&Math.abs(speed)>.2)car.position.addScaledVector(forward,-speed*dt);target.position.x=THREE.MathUtils.clamp(target.position.x,-100,100);target.position.z=THREE.MathUtils.clamp(target.position.z,-100,100);const desired=new THREE.Vector3(target.position.x+Math.sin(yaw)*Math.cos(pitch)* (driving?11:8),target.position.y+(driving?5:4)+pitch*4,target.position.z+Math.cos(yaw)*Math.cos(pitch)*(driving?11:8));camera.position.lerp(desired,1-Math.exp(-5*dt));camera.lookAt(target.position.x,target.position.y+1,target.position.z);marker.rotation.z+=dt*.7;drawMap();renderer.render(scene,camera);if(target.position.distanceTo(marker.position)<4){document.querySelector('#hint').textContent='MISSION COMPLETE · Tap NEW TASK';}}
animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.querySelector('#play').onclick=()=>document.querySelector('#start').remove();
</script>
</body></html>
