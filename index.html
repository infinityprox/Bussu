<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101a27"><title>CityLife3D — Free 3D City</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a27;color:#fff;font-family:system-ui,sans-serif;touch-action:none}#world{position:absolute;inset:0}.glass{background:linear-gradient(145deg,#101a27e8,#172b3be0);border:1px solid #ffffff35;border-radius:14px;box-shadow:0 8px 24px #0006;backdrop-filter:blur(12px)}#brand{position:absolute;top:13px;left:13px;padding:9px 13px;font-weight:900;letter-spacing:.12em;font-size:13px;pointer-events:none}#brand span{color:#75dcff}#mission{position:absolute;top:13px;left:50%;transform:translateX(-50%);padding:9px 12px;max-width:52%;text-align:center;font-size:10px;pointer-events:none}#status{position:absolute;left:13px;top:58px;padding:7px 10px;font-size:10px;letter-spacing:.1em;pointer-events:none}#hint{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:9px 12px;font-size:10px;white-space:nowrap;pointer-events:none}#joystick{position:absolute;left:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:104px;height:104px;border-radius:50%;background:radial-gradient(circle,#ffffff18,#09131e99);border:1px solid #ffffff66;box-shadow:inset 0 0 25px #0007;pointer-events:auto}#stick{position:absolute;left:30px;top:30px;width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#f5fbff,#8eafc2);box-shadow:0 4px 15px #0009;border:1px solid #fff}#actions{position:absolute;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;pointer-events:auto}button{touch-action:manipulation;pointer-events:auto;border:1px solid #ffffff55;border-radius:12px;background:linear-gradient(145deg,#24658a,#12334e);color:white;padding:10px 11px;font-weight:800;min-width:102px;box-shadow:0 6px 18px #0007;font-size:10px}button:active{filter:brightness(1.3);transform:scale(.97)}#start{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(120deg,#0b1724dc,#0b1724a6);backdrop-filter:blur(5px);z-index:5}#start .card{max-width:350px;margin:20px;padding:27px;border-radius:22px;background:linear-gradient(145deg,#1d3447,#111f2d);border:1px solid #ffffff35;text-align:center;box-shadow:0 25px 80px #0009}#start h1{font-size:31px;margin:0 0 8px}#start h1 span{color:#76ddff}#start p{color:#c4d5e1;font-size:13px;line-height:1.6}#start button{background:linear-gradient(145deg,#2699c8,#17618b);width:100%;margin-top:12px;padding:15px}#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:12px 18px;font-size:12px;z-index:3}#credit{position:absolute;bottom:4px;right:8px;font-size:9px;color:#fff;text-shadow:0 1px 4px #000;pointer-events:auto}@media(min-width:700px){#joystick{left:32px;bottom:28px;width:116px;height:116px}#stick{left:35px;top:35px}#actions{right:30px;bottom:28px;gap:8px}#actions button{padding:12px 13px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

</head><body>
<div id="world"></div><div id="brand" class="glass">CITYLIFE <span>3D</span></div><div id="mission" class="glass">DOWNTOWN DISTRICT · DAYTIME</div><div id="status" class="glass">LOADING 3D CITY</div><div id="hint" class="glass">Joystick: walk · Drag: rotate camera</div><div id="joystick"><div id="stick"></div></div><div id="actions"><button id="interact">ENTER BUILDING</button><button id="resetView">CINEMATIC VIEW</button><button id="nextTask">NEW TASK</button></div><div id="credit">3D models: Low Poly City Kit · CC0 1.0</div><div id="loading" class="glass">Loading free 3D city assets…</div>
<div id="start"><div class="card"><h1>CityLife<span>3D</span></h1><p>A mobile 3D city built with free downloadable GLB game assets. This kit is stylized low-poly art and loads models online.</p><button id="play" onclick="document.getElementById('start').remove()">ENTER THE CITY</button></div></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const ROOT='https://raw.githubusercontent.com/kayquer/kit-cidade-lowpoly/main/models/';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bbdce);scene.fog=new THREE.Fog(0x9bbdce,42,115);
const camera=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,.1,220);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.querySelector('#world').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd8efff,0x55634d,2.0));const sun=new THREE.DirectionalLight(0xffe2bd,3.2);sun.position.set(-22,35,16);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(78,78),new THREE.MeshStandardMaterial({color:0x668b5a,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.08;ground.receiveShadow=true;scene.add(ground);
const loader=new GLTFLoader(),cache={};async function asset(path){if(cache[path])return cache[path];const gltf=await loader.loadAsync(ROOT+path+'.glb');cache[path]=gltf.scene;gltf.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});return gltf.scene}
function addClone(model,x,z,scale=1,rot=0){const o=model.clone(true);o.position.set(x,0,z);o.scale.setScalar(scale);o.rotation.y=rot;scene.add(o);return o}
const player=new THREE.Group();scene.add(player);player.position.set(0,0,0);
function part(parent,geometry,material,x,y,z){const m=new THREE.Mesh(geometry,material);m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m}
const skin=new THREE.MeshStandardMaterial({color:0xc98e68}),shirt=new THREE.MeshStandardMaterial({color:0x176b91}),pants=new THREE.MeshStandardMaterial({color:0x26384c}),shoe=new THREE.MeshStandardMaterial({color:0x17202b});
part(player,new THREE.CylinderGeometry(.25,.3,.72,10),shirt,0,1.05,0);part(player,new THREE.SphereGeometry(.22,12,10),skin,0,1.62,0);
const armL=new THREE.Group(),armR=new THREE.Group(),legL=new THREE.Group(),legR=new THREE.Group();
[[armL,-.31,1.32],[armR,.31,1.32],[legL,-.13,.72],[legR,.13,.72]].forEach(v=>{v[0].position.set(v[1],v[2],0);player.add(v[0])});
part(armL,new THREE.CapsuleGeometry(.085,.42,4,8),shirt,0,-.25,0);part(armR,new THREE.CapsuleGeometry(.085,.42,4,8),shirt,0,-.25,0);
part(legL,new THREE.CapsuleGeometry(.105,.43,4,8),pants,0,-.26,0);part(legR,new THREE.CapsuleGeometry(.105,.43,4,8),pants,0,-.26,0);
part(legL,new THREE.BoxGeometry(.19,.1,.3),shoe,0,-.53,.07);part(legR,new THREE.BoxGeometry(.19,.1,.3),shoe,0,-.53,.07);
let inside=false,returnPosition=new THREE.Vector3(),walkPhase=0;
function buildInterior(){const room=new THREE.Group();room.position.set(42,0,0);scene.add(room);const mat=new THREE.MeshStandardMaterial({color:0x9a8064});const floor=new THREE.Mesh(new THREE.BoxGeometry(10,.25,10),mat);floor.position.y=-.12;room.add(floor);const wallMat=new THREE.MeshStandardMaterial({color:0xe0d4bd});[[-5,0,.25,10],[5,0,.25,10],[0,-5,10,.25],[0,5,10,.25]].forEach(v=>{const w=new THREE.Mesh(new THREE.BoxGeometry(v[2],3,v[3]),wallMat);w.position.set(v[0],1.5,v[1]);room.add(w)});const table=new THREE.Mesh(new THREE.BoxGeometry(2,.18,1.2),new THREE.MeshStandardMaterial({color:0x68442b}));table.position.set(0,.9,-1);room.add(table);return room}
buildInterior();
const carRoot=new THREE.Group();scene.add(carRoot);let carModel=null;
async function buildCity(){try{
const [road,cross,grass,apt,tall,house,shop,restaurant,tree,car]=await Promise.all([
asset('ruas/asfalto_reta'),asset('ruas/asfalto_cruzamento'),asset('terreno/grama'),asset('residencial/predio_apartamentos'),asset('residencial/predio_alto'),asset('residencial/casa_sobrado'),asset('comercial/loja_esquina'),asset('comercial/restaurante'),asset('terreno/arvores_mata'),asset('veiculos/carro')
]);
for(let x=-5;x<=5;x++)for(let z=-5;z<=5;z++){const tile=grass.clone(true);tile.position.set(x*2,-.02,z*2);scene.add(tile)}
for(let k=-4;k<=4;k+=4){for(let n=-5;n<=5;n++){addClone(road,n*2,k*2,1,Math.PI/2);addClone(road,k*2,n*2,1,0)}}
for(let x=-4;x<=4;x+=4)for(let z=-4;z<=4;z+=4)addClone(cross,x*2,z*2,1,0);
const buildings=[apt,tall,house,shop,restaurant];
const spots=[[-13,-13],[-5,-13],[5,-13],[13,-13],[-13,-5],[-5,-5],[5,-5],[13,-5],[-13,5],[-5,5],[5,5],[13,5],[-13,13],[-5,13],[5,13],[13,13]];
spots.forEach((p,i)=>addClone(buildings[i%buildings.length],p[0],p[1],1.15,(i%4)*Math.PI/2));
for(let i=0;i<16;i++){const x=(i%4)*9-13.5,z=Math.floor(i/4)*9-13.5;addClone(tree,x,z,1,0)}
// Street furniture: instanced lamps keep the mobile scene lightweight.
const poleMat=new THREE.MeshStandardMaterial({color:0x34424a,metalness:.45,roughness:.55});
const lampMat=new THREE.MeshStandardMaterial({color:0xffe8ad,emissive:0xffc45c,emissiveIntensity:1.1});
const poleGeo=new THREE.CylinderGeometry(.055,.075,3.5,7),lampGeo=new THREE.SphereGeometry(.19,8,6);
const lampPositions=[];
for(let z=-16;z<=16;z+=8){lampPositions.push([-2.2,1.75,z],[2.2,1.75,z])}
for(let x=-16;x<=16;x+=8){lampPositions.push([x,1.75,-2.2],[x,1.75,2.2])}
const poles=new THREE.InstancedMesh(poleGeo,poleMat,lampPositions.length),lamps=new THREE.InstancedMesh(lampGeo,lampMat,lampPositions.length),dummy=new THREE.Object3D();
lampPositions.forEach((p,i)=>{dummy.position.set(p[0],1.75,p[2]);dummy.updateMatrix();poles.setMatrixAt(i,dummy.matrix);dummy.position.set(p[0],3.52,p[2]);lamps.setMatrixAt(i,dummy.matrix)});
scene.add(poles,lamps);
const signalMat=new THREE.MeshStandardMaterial({color:0x25313a}),redMat=new THREE.MeshStandardMaterial({color:0xe34b42,emissive:0x8a1710,emissiveIntensity:.35}),greenMat=new THREE.MeshStandardMaterial({color:0x57d18b,emissive:0x155d34,emissiveIntensity:.3});
for(const [sx,sz] of [[-8,-8],[8,-8],[-8,8],[8,8]]){const box=new THREE.Mesh(new THREE.BoxGeometry(.28,.8,.25),signalMat);box.position.set(sx+1.05,.95,sz+1.05);scene.add(box);const a=new THREE.Mesh(new THREE.SphereGeometry(.09,7,6),redMat);a.position.set(sx+1.05,1.18,sz+1.19);scene.add(a);const b=new THREE.Mesh(new THREE.SphereGeometry(.09,7,6),greenMat);b.position.set(sx+1.05,.87,sz+1.19);scene.add(b)}
// Distant skyline makes the playable district feel part of a larger city.
const skylineMats=[0x718796,0x8799a2,0x566d7d,0x9a9b91].map(color=>new THREE.MeshStandardMaterial({color,roughness:1}));
for(let i=0;i<28;i++){const angle=i/28*Math.PI*2,radius=53+(i%3)*5,w=4+(i%3)*1.4,h=9+(i*7%19),d=4+(i%4);const tower=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),skylineMats[i%skylineMats.length]);tower.position.set(Math.cos(angle)*radius,h/2-0.05,Math.sin(angle)*radius);scene.add(tower);if(i%3===0){const crown=new THREE.Mesh(new THREE.BoxGeometry(w*.72,.45,d*.72),skylineMats[(i+1)%skylineMats.length]);crown.position.set(tower.position.x,h+.18,tower.position.z);scene.add(crown)}}
carModel=car.clone(true);carModel.scale.setScalar(1.25);carRoot.add(carModel);carRoot.position.set(0,0,2);
document.querySelector('#loading').style.display='none';document.querySelector('#status').textContent='ON ROAD · CITY EXPLORER';
}catch(e){console.error(e);document.querySelector('#loading').textContent='Could not load city models. Check internet and refresh.'}}
buildCity();
// Lightweight Village Hall landmark, streamed from Polyfork's optimized GLB CDN.
async function loadVillageHall(){
 try{
  const gltf=await loader.loadAsync('https://polyfork.dev/cdn/village-hall-c6d3c8.glb');
  const model=gltf.scene;
  model.scale.setScalar(1);
  model.position.set(29,0,29);
  model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
  scene.add(model);
  document.querySelector('#mission').textContent='DOWNTOWN LANDMARK · VILLAGE HALL';
  document.querySelector('#credit').textContent='Village Hall · Polyfork · low-poly GLB';
 }catch(e){console.warn('Village Hall model could not load; check internet connection.',e)}
}
loadVillageHall();
let joy={x:0,y:0},heading=0,drag=null,camDist=8.2,mission=0;const tasks=['Explore the downtown blocks','Cruise past the apartments','Visit the shopping street','Explore the city park'];
const j=document.querySelector('#joystick'),stick=document.querySelector('#stick');
function moveJoy(e){const r=j.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy),m=35;if(l>m){dx=dx/l*m;dy=dy/l*m}joy.x=dx/m;joy.y=dy/m;stick.style.transform='translate('+dx+'px,'+dy+'px)'}
j.addEventListener('pointerdown',e=>{j.setPointerCapture(e.pointerId);moveJoy(e)});j.addEventListener('pointermove',e=>{if(e.buttons)moveJoy(e)});function resetJoy(){joy={x:0,y:0};stick.style.transform='translate(0,0)'}j.addEventListener('pointerup',resetJoy);j.addEventListener('pointercancel',resetJoy);
renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY}});addEventListener('pointerup',()=>drag=null);addEventListener('pointermove',e=>{if(drag){heading-=(e.clientX-drag.x)*.006;drag={x:e.clientX,y:e.clientY}}});
const buildingSpots=[[-13,-13],[-5,-13],[5,-13],[13,-13],[-13,-5],[-5,-5],[5,-5],[13,-5],[-13,5],[-5,5],[5,5],[13,5],[-13,13],[-5,13],[5,13],[13,13]];
function nearestBuildingDistance(){let best=Infinity;for(const p of buildingSpots){const d=Math.hypot(player.position.x-p[0],player.position.z-p[1]);if(d<best)best=d}return best}
const interactButton=document.querySelector('#interact');
interactButton.addEventListener('click',()=>{if(inside){inside=false;player.position.copy(returnPosition);interactButton.textContent='ENTER BUILDING';document.querySelector('#hint').textContent='Walk near any building, then tap ENTER BUILDING';return}const distance=nearestBuildingDistance();if(distance<8){returnPosition.copy(player.position);inside=true;player.position.set(42,0,2);interactButton.textContent='EXIT BUILDING';document.querySelector('#hint').textContent='Inside building · tap EXIT BUILDING to leave'}else{document.querySelector('#hint').textContent='Get closer to a building — walk towards the nearby houses or shops'}});
document.querySelector('#resetView').onclick=()=>{heading=0;camDist=7.2};document.querySelector('#nextTask').onclick=()=>{mission=(mission+1)%tasks.length;document.querySelector('#mission').textContent='TASK 0'+(mission+1)+' · '+tasks[mission]};
document.querySelector('#play').onclick=()=>{document.querySelector('#start').remove()};
let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;const moving=Math.abs(joy.x)+Math.abs(joy.y)>.05;if(moving){heading-=joy.x*1.8*dt;const speed=-joy.y*(inside?3.2:4.4)*dt;player.position.x+=Math.sin(heading)*speed;player.position.z+=Math.cos(heading)*speed;player.rotation.y=heading;walkPhase+=dt*10;armL.rotation.x=Math.sin(walkPhase)*.65;armR.rotation.x=-Math.sin(walkPhase)*.65;legL.rotation.x=-Math.sin(walkPhase)*.7;legR.rotation.x=Math.sin(walkPhase)*.7}else{armL.rotation.x*=.82;armR.rotation.x*=.82;legL.rotation.x*=.82;legR.rotation.x*=.82}const target=new THREE.Vector3(player.position.x-Math.sin(heading)*camDist,inside?3.5:3.9,player.position.z-Math.cos(heading)*camDist);camera.position.lerp(target,.09);camera.lookAt(player.position.x,inside?1.2:1.1,player.position.z);if(!inside){const near=nearestBuildingDistance()<8;interactButton.textContent=near?'ENTER BUILDING':'BUILDING: WALK CLOSER';interactButton.style.opacity=near?'1':'.72'}document.querySelector('#status').textContent=inside?'INSIDE BUILDING':(moving?'ON FOOT · WALKING':'ON FOOT · CITY EXPLORER');renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6))});
</script></body></html>
