<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff8ec" />
  <title>Pasi — AI Recipe Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: {
      chilli: '#C8372D', turmeric: '#F4B41A', cream: '#FFF8EC', brown: '#3B2A20'
    }, fontFamily: { sans: ['Poppins','Noto Sans Tamil','sans-serif'] } } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: Poppins, 'Noto Sans Tamil', sans-serif; }
    .chip { animation: pop .16s ease-out; }
    @keyframes pop { from { transform:scale(.88); opacity:0 } to { transform:scale(1);opacity:1 } }
    .skeleton { background:linear-gradient(90deg,#f2e8d8 25%,#fff7e9 50%,#f2e8d8 75%);background-size:200% 100%;animation:shine 1.25s infinite; }
    @keyframes shine { to { background-position:-200% 0 } }
    .dark .skeleton { background:linear-gradient(90deg,#3c3028 25%,#514237 50%,#3c3028 75%);background-size:200% 100%; }
    .safe-bottom { padding-bottom: max(1.25rem, env(safe-area-inset-bottom)); }
    button:focus-visible,input:focus-visible,select:focus-visible { outline:3px solid #F4B41A;outline-offset:2px; }
  </style>
</head>
<body class="bg-cream text-brown dark:bg-[#191512] dark:text-[#fff4e4]">
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const {useState, useMemo} = React;
    const quick = ['thakkali','vengayam','muttai','paneer','urulai','arisi'];
    const randomSets = [
      ['thakkali','vengayam','arisi','pachai milagai'],
      ['urulai','paneer','carrot','peas'],
      ['muttai','vengayam','bread','thakkali'],
      ['paneer','capsicum','vengayam','chapati']
    ];
    const SYSTEM = \`You are a friendly Indian home-cooking assistant inside a recipe app called Pasi. Suggest exactly 3 recipes that mainly use the ingredients the user has.
Assume basic pantry items: salt, oil, water, turmeric, chilli powder, coriander powder, mustard seeds, cumin. Never list them as missing.
Respect diet, max cooking time and spice level. If the user mentions an allergy, never include that ingredient or an obvious derivative. Prefer South Indian / Tamil home-style dishes when suitable, with variety. Write in requested language: tamil, english or tanglish. Give 5 to 8 short steps. Quantities must match requested servings.
Return ONLY valid JSON, no markdown or fences, matching:
{"recipes":[{"name":"","description":"","time_minutes":0,"servings":0,"difficulty":"easy|medium|hard","spice_level":"mild|medium|hot","diet":"veg|non-veg","ingredients":[{"item":"","amount":0,"unit":"","have":true}],"missing_ingredients":[""],"steps":[""],"tip":""}]}
For each ingredient, amount must be numeric and unit a short string. Set have=true only when the user has it or it is a basic pantry item. Keep missing_ingredients consistent with have=false. Do not include any allergen in any recipe.\`;
    function App(){
      const [ingredients,setIngredients]=useState([]);
      const [draft,setDraft]=useState('');
      const [diet,setDiet]=useState('Any');
      const [time,setTime]=useState('30');
      const [spice,setSpice]=useState('Medium');
      const [servings,setServings]=useState(2);
      const [allergies,setAllergies]=useState('');
      const [language,setLanguage]=useState('tanglish');
      const [recipes,setRecipes]=useState([]);
      const [favorites,setFavorites]=useState([]);
      const [tab,setTab]=useState('discover');
      const [selected,setSelected]=useState(null);
      const [detailServings,setDetailServings]=useState(2);
      const [loading,setLoading]=useState(false);
      const [error,setError]=useState('');
      const [dark,setDark]=useState(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      React.useEffect(()=>{document.documentElement.classList.toggle('dark',dark)},[dark]);
      const addIngredient=(value)=>{
        const v=value.trim().replace(/,$/,'').trim();
        if(v && !ingredients.some(x=>x.toLowerCase()===v.toLowerCase())) setIngredients(old=>[...old,v]);
        setDraft('');
      };
      const onDraft=(value)=>{
        if(value.includes(',')){ value.split(',').forEach(addIngredient); }
        else setDraft(value);
      };
      const getRecipes=async()=>{
        if(!ingredients.length){setError('Add at least one ingredient to get started.');return;}
        setLoading(true);setError('');setRecipes([]);setSelected(null);
        const userPrompt=\`Ingredients I have: \${ingredients.join(', ')}
Diet: \${diet}
Max time: \${time} minutes
Spice level: \${spice}
Servings: \${servings}
Allergies: \${allergies.trim() || 'none'}
Language: \${language}\`;
        try{
          const response=await fetch('/api/recipes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:SYSTEM,prompt:userPrompt})});
          const payload=await response.json().catch(()=>({}));
          if(!response.ok) throw new Error(payload.error || 'Could not get recipes. Please try again.');
          let raw=payload.content || payload.text || '';
          raw=raw.trim().replace(/^\\\`\\\`\\\`(?:json)?\\s*/i,'').replace(/\\s*\\\`\\\`\\\`$/,'');
          const parsed=JSON.parse(raw);
          if(!Array.isArray(parsed.recipes)||parsed.recipes.length!==3) throw new Error('The recipe response was incomplete. Please retry.');
          setRecipes(parsed.recipes);
          setTab('discover');
        }catch(e){setError(e.message || 'Something went wrong. Please try again.');}
        finally{setLoading(false);}
      };
      const toggleFavorite=(recipe)=>{
        setFavorites(old=>old.some(r=>r.name===recipe.name)?old.filter(r=>r.name!==recipe.name):[...old,recipe]);
      };
      const openRecipe=(recipe)=>{setSelected(recipe);setDetailServings(recipe.servings || servings);};
      const scale=(amount,base)=> {
        const value=Number(amount||0)*detailServings/(Number(base)||detailServings);
        return Number.isInteger(value)?String(value):String(Math.round(value*100)/100);
      };
      const copyRecipe=async(recipe)=>{
        const text=\`\${recipe.name}\\n\${recipe.description}\\n\\nIngredients:\\n\${(recipe.ingredients||[]).map(i=>\`• \${i.item}: \${i.amount} \${i.unit}\`).join('\\n')}\\n\\nSteps:\\n\${(recipe.steps||[]).map((s,i)=>\`\${i+1}. \${s}\`).join('\\n')}\\n\\nTip: \${recipe.tip||''}\`;
        try{await navigator.clipboard.writeText(text);alert('Recipe copied!');}catch{setError('Clipboard access is unavailable in this browser.');}
      };
      const visible=tab==='favorites'?favorites:recipes;
      const isFav=(r)=>favorites.some(x=>x.name===r.name);
      const Card=({recipe})=><article className="rounded-3xl bg-white dark:bg-[#28211c] border border-[#f0e4d3] dark:border-[#44372d] p-5 shadow-sm">
        <div className="flex items-start justify-between gap-3">
          <div className="min-w-0"><div className="flex flex-wrap gap-2 mb-3"><span className={\`text-xs px-2.5 py-1 rounded-full font-semibold \${recipe.diet==='non-veg'?'bg-orange-100 text-orange-800':'bg-green-100 text-green-800'}\`}>{recipe.diet==='non-veg'?'Non-veg':'Veg'}</span><span className="text-xs px-2.5 py-1 rounded-full bg-[#fff2cf] text-[#76510a]">{recipe.spice_level||spice}</span></div>
          <h3 className="font-bold text-lg leading-snug">{recipe.name}</h3><p className="text-sm text-[#806d5d] dark:text-[#c6b5a4] mt-1">{recipe.description}</p></div>
          <button aria-label="Save favorite" onClick={()=>toggleFavorite(recipe)} className="text-2xl leading-none p-1">{isFav(recipe)?'❤️':'♡'}</button>
        </div>
        <div className="flex flex-wrap gap-3 text-xs text-[#806d5d] dark:text-[#c6b5a4] mt-4"><span>◷ {recipe.time_minutes} min</span><span>✦ {recipe.difficulty}</span><span>♨ {recipe.spice_level}</span></div>
        <div className="mt-4 flex flex-wrap gap-2">{(recipe.ingredients||[]).slice(0,5).map((item,i)=><span key={i} className={\`text-xs rounded-full px-2.5 py-1 \${item.have?'bg-green-50 text-green-800 dark:bg-green-950 dark:text-green-200':'bg-orange-50 text-orange-800 dark:bg-orange-950 dark:text-orange-200'}\`}>{item.have?'✓':'＋'} {item.item}</span>)}{(recipe.ingredients||[]).length>5&&<span className="text-xs px-2 py-1 text-[#806d5d]">+{recipe.ingredients.length-5} more</span>}</div>
        <button onClick={()=>openRecipe(recipe)} className="mt-5 w-full rounded-2xl bg-chilli hover:bg-[#a92d25] text-white font-semibold py-3">View recipe <span aria-hidden="true">→</span></button>
      </article>;
      return <div className="min-h-screen">
        <header className="sticky top-0 z-20 bg-cream/95 dark:bg-[#191512]/95 backdrop-blur border-b border-[#eadcc8] dark:border-[#3a3028]">
          <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <button onClick={()=>{setTab('discover');setSelected(null)}} className="flex items-center gap-2"><span className="w-10 h-10 rounded-2xl bg-chilli text-white grid place-items-center text-2xl">🥘</span><span className="text-left"><span className="block text-xl font-extrabold tracking-tight">pasi<span className="text-chilli">.</span></span><span className="block text-[10px] tracking-wide text-[#8b7562] -mt-1">AI RECIPE ASSISTANT</span></span></button>
            <div className="flex items-center gap-2"><button onClick={()=>setDark(!dark)} className="w-10 h-10 rounded-full border border-[#eadcc8] dark:border-[#514236]" aria-label="Toggle theme">{dark?'☀️':'🌙'}</button><button onClick={()=>setTab(tab==='favorites'?'discover':'favorites')} className="rounded-full px-3 py-2 text-sm font-semibold bg-white dark:bg-[#30271f] border border-[#eadcc8] dark:border-[#514236]">♡ <span className="hidden sm:inline">Favorites</span> ({favorites.length})</button></div>
          </div>
        </header>
        <main className="max-w-5xl mx-auto px-4 pt-7 pb-12">
          {selected ? <section className="max-w-2xl mx-auto">
            <button onClick={()=>setSelected(null)} className="text-sm font-semibold text-chilli mb-5">← Back to recipes</button>
            <div className="rounded-3xl bg-white dark:bg-[#28211c] border border-[#f0e4d3] dark:border-[#44372d] p-5 sm:p-7 shadow-sm">
              <div className="flex justify-between gap-3"><div><span className="text-xs font-bold tracking-widest text-chilli uppercase">Pasi recipe</span><h1 className="text-2xl sm:text-3xl font-extrabold mt-2">{selected.name}</h1><p className="text-sm text-[#806d5d] dark:text-[#c6b5a4] mt-2">{selected.description}</p></div><button onClick={()=>toggleFavorite(selected)} className="text-2xl">{isFav(selected)?'❤️':'♡'}</button></div>
              <div className="flex flex-wrap gap-2 mt-4 text-xs"><span className="bg-[#fff2cf] text-[#76510a] rounded-full px-3 py-1">{selected.time_minutes} min</span><span className="bg-[#f7eee4] dark:bg-[#40352c] rounded-full px-3 py-1">{selected.difficulty}</span><span className="bg-[#f7eee4] dark:bg-[#40352c] rounded-full px-3 py-1">{selected.spice_level}</span></div>
              <div className="flex items-center justify-between mt-7 mb-3"><h2 className="font-bold text-lg">Ingredients</h2><div className="flex items-center gap-3 text-sm"><button onClick={()=>setDetailServings(Math.max(1,detailServings-1))} className="w-8 h-8 rounded-full bg-[#f6ead8] dark:bg-[#40352c] font-bold">−</button><span className="font-semibold tabular-nums">{detailServings} servings</span><button onClick={()=>setDetailServings(Math.min(8,detailServings+1))} className="w-8 h-8 rounded-full bg-[#f6ead8] dark:bg-[#40352c] font-bold">＋</button></div></div>
              <div className="divide-y divide-[#f0e4d3] dark:divide-[#44372d]">{(selected.ingredients||[]).map((item,i)=><div key={i} className="py-3 flex items-center justify-between gap-3 text-sm"><span className="flex items-center gap-2"><span className={item.have?'text-green-600':'text-orange-600'}>{item.have?'✓':'＋'}</span>{item.item}</span><span className="font-semibold text-[#806d5d] dark:text-[#c6b5a4] whitespace-nowrap">{scale(item.amount,selected.servings)} {item.unit}</span></div>)}</div>
              {(selected.missing_ingredients||[]).length>0&&<p className="text-xs text-orange-700 dark:text-orange-300 mt-3">Still needed: {selected.missing_ingredients.join(', ')}</p>}
              <h2 className="font-bold text-lg mt-8 mb-3">Let's cook</h2><ol className="space-y-4">{(selected.steps||[]).map((step,i)=><li key={i} className="flex gap-3 text-sm leading-relaxed"><span className="shrink-0 w-7 h-7 rounded-full bg-[#fff0c9] text-[#805500] grid place-items-center font-bold">{i+1}</span><span className="pt-1">{step}</span></li>)}</ol>
              <div className="mt-7 rounded-2xl bg-[#fff4d9] dark:bg-[#45351f] p-4"><p className="font-bold text-sm">👩🏽‍🍳 Pasi tip</p><p className="text-sm mt-1">{selected.tip}</p></div>
              <button onClick={()=>copyRecipe(selected)} className="mt-5 w-full rounded-2xl border border-[#e7d7c3] dark:border-[#514236] py-3 font-semibold">▢ Copy recipe</button>
            </div>
          </section> : <>
            <section className="relative overflow-hidden rounded-[2rem] bg-[#3B2A20] text-white p-6 sm:p-9 mb-7">
              <div className="absolute -right-6 -top-10 text-[140px] opacity-15">🍅</div><div className="relative max-w-xl"><span className="text-xs tracking-[.2em] font-semibold text-[#F4B41A] uppercase">Your kitchen, your possibilities</span><h1 className="text-3xl sm:text-4xl font-extrabold mt-3 leading-tight">What’s in your fridge?</h1><p className="mt-3 text-sm sm:text-base text-[#f3dfc8]">Pasi ku onnu, fridge la irukku.</p><p className="text-xs text-[#d6c2ac] mt-2">Tell me what you have. I’ll find something delicious.</p></div>
            </section>
            <div className="grid lg:grid-cols-[1.1fr_.9fr] gap-6 items-start">
              <section className="rounded-3xl bg-white dark:bg-[#28211c] border border-[#f0e4d3] dark:border-[#44372d] p-5 sm:p-6 shadow-sm">
                <div className="flex justify-between items-center gap-2"><h2 className="font-bold text-lg">Your ingredients</h2><button onClick={()=>{setIngredients([]);setDraft('')}} className="text-xs text-chilli font-semibold">Clear all</button></div>
                <div className="mt-4 flex flex-wrap gap-2 min-h-10">{ingredients.map((item,i)=><span key={item} className="chip flex items-center gap-2 rounded-full bg-[#fff0d6] dark:bg-[#493821] text-[#68451d] dark:text-[#ffe2ad] px-3 py-2 text-sm">{item}<button onClick={()=>setIngredients(old=>old.filter((_,n)=>n!==i))} aria-label={'Remove '+item} className="font-bold">×</button></span>)}{!ingredients.length&&<span className="text-sm text-[#9b8875]">Your ingredient chips will appear here.</span>}</div>
                <div className="mt-4 flex gap-2"><input value={draft} onChange={e=>onDraft(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();addIngredient(draft)}}} placeholder="Type an ingredient and press Enter…" className="min-w-0 flex-1 rounded-2xl bg-[#fffaf2] dark:bg-[#211b17] border border-[#eadcc8] dark:border-[#514236] px-4 py-3 text-sm outline-none" /><button onClick={()=>addIngredient(draft)} className="rounded-2xl bg-brown text-white px-4 font-semibold">Add</button></div>
                <p className="text-xs text-[#8b7562] mt-4 mb-2">Quick add</p><div className="flex flex-wrap gap-2">{quick.map(x=><button key={x} onClick={()=>addIngredient(x)} disabled={ingredients.includes(x)} className="rounded-full border border-[#eadcc8] dark:border-[#514236] px-3 py-1.5 text-xs disabled:opacity-40">＋ {x}</button>)}</div>
                <button onClick={()=>{const set=randomSets[Math.floor(Math.random()*randomSets.length)];setIngredients(set)}} className="mt-4 text-xs font-semibold text-chilli">✦ Surprise me</button>
              </section>
              <section className="rounded-3xl bg-white dark:bg-[#28211c] border border-[#f0e4d3] dark:border-[#44372d] p-5 sm:p-6 shadow-sm">
                <h2 className="font-bold text-lg mb-4">Your preferences</h2>
                <label className="block text-xs font-semibold mb-2">Diet</label><div className="grid grid-cols-3 gap-2 mb-4">{['Veg','Non-veg','Any'].map(x=><button key={x} onClick={()=>setDiet(x)} className={\`rounded-xl py-2.5 text-xs font-semibold border \${diet===x?'bg-chilli text-white border-chilli':'border-[#eadcc8] dark:border-[#514236]'}\`}>{x}</button>)}</div>
                <label className="block text-xs font-semibold mb-2">Maximum cooking time</label><div className="grid grid-cols-4 gap-2 mb-4">{['15','30','45','60'].map(x=><button key={x} onClick={()=>setTime(x)} className={\`rounded-xl py-2.5 text-xs font-semibold border \${time===x?'bg-chilli text-white border-chilli':'border-[#eadcc8] dark:border-[#514236]'}\`}>{x}m</button>)}</div>
                <label className="block text-xs font-semibold mb-2">Spice level</label><div className="grid grid-cols-3 gap-2 mb-4">{['Mild','Medium','Hot'].map(x=><button key={x} onClick={()=>setSpice(x)} className={\`rounded-xl py-2.5 text-xs font-semibold border \${spice===x?'bg-chilli text-white border-chilli':'border-[#eadcc8] dark:border-[#514236]'}\`}>{x}</button>)}</div>
                <div className="flex items-center justify-between mb-4"><label className="text-xs font-semibold">Servings</label><div className="flex items-center gap-3"><button onClick={()=>setServings(Math.max(1,servings-1))} className="w-8 h-8 rounded-full bg-[#f6ead8] dark:bg-[#40352c] font-bold">−</button><span className="font-semibold text-sm tabular-nums">{servings}</span><button onClick={()=>setServings(Math.min(8,servings+1))} className="w-8 h-8 rounded-full bg-[#f6ead8] dark:bg-[#40352c] font-bold">＋</button></div></div>
                <label className="block text-xs font-semibold mb-2">Allergies <span className="font-normal text-[#9b8875]">(optional)</span></label><input value={allergies} onChange={e=>setAllergies(e.target.value)} placeholder="e.g. peanuts, milk" className="w-full rounded-xl bg-[#fffaf2] dark:bg-[#211b17] border border-[#eadcc8] dark:border-[#514236] px-3 py-2.5 text-sm mb-4"/>
                <label className="block text-xs font-semibold mb-2">Recipe language</label><select value={language} onChange={e=>setLanguage(e.target.value)} className="w-full rounded-xl bg-[#fffaf2] dark:bg-[#211b17] border border-[#eadcc8] dark:border-[#514236] px-3 py-2.5 text-sm"><option value="tanglish">Tanglish</option><option value="tamil">தமிழ் (Tamil)</option><option value="english">English</option></select>
              </section>
            </div>
            <div className="mt-6">{error&&<div role="alert" className="mb-4 rounded-2xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900 text-red-800 dark:text-red-200 p-4 text-sm flex items-center justify-between gap-3"><span>{error}</span><button onClick={getRecipes} className="shrink-0 underline font-bold">Retry</button></div>}
              <button onClick={getRecipes} disabled={loading} className="w-full rounded-2xl bg-chilli hover:bg-[#a92d25] disabled:opacity-60 text-white font-bold py-4 shadow-lg shadow-[#c8372d]/15">{loading?'Cooking up ideas…':'Get 3 recipes  →'}</button>
            </div>
            {loading&&<section className="mt-8"><p className="text-center font-semibold text-sm mb-5">Pasi aarra varaikum, samaichitu irukken...</p><div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">{[1,2,3].map(x=><div key={x} className="rounded-3xl p-5 bg-white dark:bg-[#28211c] border border-[#f0e4d3] dark:border-[#44372d]"><div className="skeleton h-5 w-20 rounded-full mb-4"/><div className="skeleton h-6 w-3/4 rounded mb-3"/><div className="skeleton h-4 w-full rounded mb-2"/><div className="skeleton h-4 w-2/3 rounded mb-6"/><div className="skeleton h-10 w-full rounded-xl"/></div>)}</div></section>}
            {!loading&&recipes.length===0&&<div className="text-center py-10"><div className="text-5xl mb-3">🧺</div><p className="font-semibold">Fridge la enna irukku? Sollunga, naan pathukkaren.</p><p className="text-xs text-[#9b8875] mt-2">Add a few ingredients to get started.</p></div>}
          </>}
          {!selected&&tab==='favorites'&&<section className="mt-8"><h2 className="font-bold text-xl mb-4">Your saved recipes</h2>{favorites.length?<div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">{favorites.map((r,i)=><Card key={r.name+i} recipe={r}/>)}</div>:<p className="text-sm text-[#8b7562] py-8 text-center">No favorites yet. Tap the heart on a recipe to save it.</p>}</section>}
          {!selected&&tab==='discover'&&recipes.length>0&&!loading&&<section className="mt-8"><div className="flex items-end justify-between mb-4"><div><span className="text-xs font-bold tracking-widest text-chilli uppercase">Made with what you have</span><h2 className="text-xl font-extrabold mt-1">Your recipe ideas</h2></div><span className="text-xs text-[#8b7562]">3 recipes</span></div><div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">{recipes.map((r,i)=><Card key={r.name+i} recipe={r}/>)}</div></section>}
        </main>
        <footer className="safe-bottom border-t border-[#eadcc8] dark:border-[#3a3028] text-center px-4 py-6 text-xs text-[#8b7562]">AI-generated recipes. Check ingredients for allergies before cooking.</footer>
      </div>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
